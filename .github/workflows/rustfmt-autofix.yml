# Formats the Rust sources with the repository's own pinned toolchain (rust-toolchain.toml:
# stable with rustfmt and clippy), commits what rustfmt changed, then proves the result:
# `cargo fmt --all --check`, `cargo check --workspace`, `cargo test --workspace`.
#
# Run by hand (Actions -> Rustfmt autofix -> Run workflow, on the branch to fix), or by a push
# to a rustfmt-fix/** branch. Changes are only ever to files rustfmt rewrites (formatting, no
# logic). They come back two ways: a commit on the branch the run was started on (the
# workflow's own token, contents: write) and, always, as the "rustfmt-patch" artifact. If the
# branch refuses the push (a protected main), the commit goes to the branch rustfmt-autofix
# instead, to merge by a pull request. A push made with GITHUB_TOKEN does not start other
# workflows, so the checks below run in this same job, after the commit.
name: Rustfmt autofix

on:
  workflow_dispatch:
  push:
    branches: ["rustfmt-fix/**"]

concurrency:
  group: rustfmt-autofix-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml picks stable with rustfmt and clippy.
      - name: Toolchain (with rustfmt)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt
          rustc --version
          cargo --version
          cargo fmt --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Linux libraries
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: cargo fmt --all
        run: cargo fmt --all

      - name: Keep what rustfmt changed as a patch
        run: |
          git diff --stat
          git diff > rustfmt.patch
          if [ -s rustfmt.patch ]; then echo "changed=true" >> "$GITHUB_ENV"; else echo "changed=false" >> "$GITHUB_ENV"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: error

      - name: Commit the formatting
        if: env.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Format the Rust sources with cargo fmt --all"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" \
            || { echo "::warning::${GITHUB_REF_NAME} refused the push; using rustfmt-autofix"; \
                 git push --force origin HEAD:refs/heads/rustfmt-autofix; }

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo check --workspace
        run: cargo check --workspace

      - name: cargo test --workspace
        run: cargo test --workspace
