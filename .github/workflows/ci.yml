# Build, lint and test main and every pull request, on Windows only: NetGuard Download Manager is
# distributed for Windows. (The source keeps its Linux and macOS code paths, as the original
# application has them; they are simply not built or released from here.)
name: CI

# Pushes to main only: a pull request's branch is tested once as the pull request (a bare push:
# ran everything twice), and a release tag's commit was already tested on main.
# A change to the docs alone builds nothing here. The app's own catalogs, i18n/*.tsv, still run
# everything.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# A newer commit on a pull request makes its older run moot: cancel it (main runs to the end).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: windows
    runs-on: windows-latest
    # A cold build takes about 10 minutes; a hung runner is cut off instead of running to
    # GitHub's 6 hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml picks stable with rustfmt and clippy.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all --check

      # A text added to the code without running tools/i18n/extract.py fails here; missing
      # translations don't (they show in English until tools/i18n/translate.py runs).
      - name: English catalog matches the code
        run: |
          python tools/i18n/extract.py
          git diff --exit-code -- i18n/en.tsv

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The crash tests start examples/crashy: built here, before them, so a missing program shows
      # as a build error and not as a test that can't start it.
      - name: Build the crash tests' example
        run: cargo build -p mdm-crash --example crashy

      - name: Tests
        run: cargo test --workspace

  # A translator's reviewed rows (no "#, machine" line) must survive every pull request: no
  # tool or merge may drop them or hand them back to machine translation.
  translations:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reviewed translations kept
        run: python tools/i18n/reviewed_guard.py --base "origin/${{ github.base_ref }}"

  extension:
    name: browser extension
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Logic against fake Firefox and Chrome APIs
        run: node tools/extension/test.mjs

      # Chrome, Edge, Brave, Opera, Vivaldi (mdm-chromium.zip), Firefox (mdm-firefox.xpi) and
      # the Chrome Web Store's copy (mdm-chrome-store.zip).
      - name: Pack for every browser
        shell: pwsh
        run: ./tools/extension/pack.ps1

      - name: Check the packages
        run: node tools/extension/check-pack.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            target/extension/mdm-chromium.zip
            target/extension/mdm-firefox.xpi
            target/extension/mdm-chrome-store.zip
