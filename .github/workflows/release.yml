# Builds the Windows downloads of NetGuard Download Manager:
#   tools/installer/build.ps1: the installer, the portable zip and the plain zip,
#   tools/extension/pack.ps1: the browser extensions (Chromium zip, Firefox .xpi).
# Windows only: there are no Linux or macOS builds.
# - A pushed tag vX.Y.Z (matching Cargo.toml's version) publishes a GitHub release with them and
#   SHA256SUMS.txt, its notes from CHANGELOG.md.
# - Run by hand (Actions -> Release -> Run workflow) it only builds and keeps them as artifacts:
#   nothing is published.
# The application has no updater in this release: nothing reads these releases from inside it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  geo:
    # Where a download's server is: this month's IP-to-country table (DB-IP's IP to Country
    # Lite, CC BY 4.0) for the build. A failed download keeps the committed one, with a warning.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: IP-to-country table
        run: python tools/geo/build.py --release

      - uses: actions/upload-artifact@v4
        with:
          name: geo-data
          path: crates/geo/data/*
          retention-days: 7

  windows:
    needs: geo
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: geo-data
          path: crates/geo/data

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-cargo-

      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} but Cargo.toml says $v" }

      # The crash tests start examples/crashy: built here, before them, so a missing program shows
      # as a build error and not as a test that can't start it.
      - name: Build the crash tests' example
        run: cargo build -p mdm-crash --example crashy

      - name: Tests
        run: cargo test --workspace

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      # Code signing is optional: with the CODESIGN_PFX_BASE64 and CODESIGN_PASSWORD secrets
      # set, the programs, the installer and its uninstaller are signed; without, unsigned.
      - name: Code-signing certificate
        id: cert
        shell: pwsh
        env:
          PFX: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          if (-not $env:PFX) { "No certificate: building unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          "command=`"$($signtool.FullName)`" sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f `"$pfx`" /p `"$env:PASSWORD`" `$f" >> $env:GITHUB_OUTPUT

      - name: Installer and portable zip
        shell: pwsh
        env:
          MDM_SIGN_COMMAND: ${{ steps.cert.outputs.command }}
        run: ./tools/installer/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/dist/*

  extension:
    # Every browser's extension as its own download: Chrome, Edge, Brave, Opera and Vivaldi
    # (unzip, then load the folder unpacked) and Firefox (.xpi). Nothing is sent to a browser's
    # extension store.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: node tools/extension/test.mjs

      - name: Chromium zip and Firefox .xpi
        shell: pwsh
        run: |
          ./tools/extension/pack.ps1
          node tools/extension/check-pack.mjs
          $v = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          New-Item -ItemType Directory -Force target/dist | Out-Null
          Copy-Item target/extension/mdm-chromium.zip "target/dist/NetGuard-Download-Manager-$v-extension-chromium.zip"
          Copy-Item target/extension/mdm-firefox.xpi "target/dist/NetGuard-Download-Manager-$v-extension-firefox.xpi"

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: target/dist/*

  publish:
    permissions:
      contents: write # the release
      issues: read # the release notes' Thanks to (tools/contributors.py)
      pull-requests: read
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') && needs.windows.result == 'success' &&
      needs.extension.result == 'success'
    needs: [windows, extension]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # One SHA256SUMS.txt for every file (each build wrote its own).
          Remove-Item dist/SHA256SUMS*.txt -ErrorAction SilentlyContinue
          $files = Get-ChildItem dist -File | Sort-Object Name
          $sums = $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          Set-Content -Encoding ascii dist/SHA256SUMS.txt $sums
          # Notes: the version's section of CHANGELOG.md ("## [X.Y.Z]" up to the next "## "),
          # else GitHub's list of changes since the last tag.
          $v = "${{ github.ref_name }}".TrimStart("v")
          $log = Get-Content CHANGELOG.md -Raw -ErrorAction SilentlyContinue
          $m = [regex]::Match("$log", "(?ms)^## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=^## |\z)")
          $title = "NetGuard Download Manager ${{ github.ref_name }}"
          # Last, "Thanks to": everyone who opened a pull request or an issue, or commented, on
          # GitHub since the previous release (tools/contributors.py thanks). Nobody, or GitHub
          # not answering, leaves it out; it never stops the release.
          $thanks = ""
          try {
            $thanks = (python tools/contributors.py thanks "${{ github.ref_name }}" | Out-String).Trim()
          } catch {
            Write-Warning "The contributors couldn't be listed: $_"
          }
          if ($thanks) { $thanks = "`n`n" + $thanks }
          $all = (Get-ChildItem dist -File).FullName
          if ($m.Success -and $m.Groups[1].Value.Trim()) {
            # Links into the repository (docs/x.md) would resolve against the release's page:
            # point them at the tagged files.
            $notes = $m.Groups[1].Value.Trim() -replace '\]\((?![a-z]+:|#)([^)\s]+)\)', '](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/$1)'
            Set-Content -Encoding utf8 notes.md ($notes + $thanks)
            gh release create "${{ github.ref_name }}" --latest --title $title --notes-file notes.md $all
          } else {
            Set-Content -Encoding utf8 notes.md ($thanks.Trim())
            gh release create "${{ github.ref_name }}" --latest --title $title --notes-file notes.md --generate-notes $all
          }
