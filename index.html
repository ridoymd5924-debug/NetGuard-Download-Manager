<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetGuard Download Manager</title>
    <script>
      // Apply the saved theme before first paint (mirrors src/utils/theme.ts).
      try {
        if (localStorage.getItem('ng-theme') === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      } catch (e) { /* ignore */ }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #080f1f; }
      html.light body { background: #f4f7fc; }
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #223454; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #2d4670; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
